ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    ErrorLog /dev/stderr
    ErrorLogFormat "[%{u}t] [%-m:%l] [pid %P] %M"
    CustomLog /dev/null combined

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
