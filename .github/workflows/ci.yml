name: CI

on:
  push:
    branches: [main, release]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '24'
  APP_ENV: testing
  APP_KEY: 'base64:Vn2utCpJjCtA1UHy8yLfPFWDYMvswA8Ss0CS20rcF34='

jobs:
  php-sqlite:
    name: PHP suite on SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite, gd, intl, zip
          coverage: none
      - uses: ramsey/composer-install@4.0.0
      - run: cp env.example .env
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: composer verify
      - run: composer test

  php-postgres:
    name: PHP suite on PostgreSQL
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: omc-studio
      DB_USERNAME: omc-studio
      DB_PASSWORD: ci-only
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: omc-studio
          POSTGRES_USER: omc-studio
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omc-studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, gd, intl, zip
          coverage: none
      - uses: ramsey/composer-install@4.0.0
      - run: cp env.example .env
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: php artisan migrate --force
      - run: composer test

  js:
    name: Vitest, types, lint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: npm run check

  e2e:
    name: Playwright on three engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite, gd, intl, zip
          coverage: none
      - uses: ramsey/composer-install@4.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: sh scripts/serve-e2e.sh
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test --grep-invert 'Secure session cookie'
      - run: SESSION_SECURE_COOKIE=true sh scripts/serve-e2e.sh
      - run: npx playwright test --project=chromium --grep 'Secure session cookie'

  audit:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - run: composer audit --locked
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm audit --audit-level=high

  image:
    name: Delivered image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag omc-studio:ci .
