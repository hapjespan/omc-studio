# =============================================================================
# CI for Laravel projects - Pint, Larastan, Pest (PostgreSQL) and audit
#
# Install as: .github/workflows/ci.yml
#
# Expected in the project:
# Green from the first commit of a scaffolded project, and honest about it.
# Pint and the audits run against what `laravel new` produces. The Larastan and
# Pest jobs check whether their binary is installed and skip with a note in the
# run summary when it is not, so the pipeline is not red for weeks over tooling
# nobody has added yet. Install the package and the job turns real on its own.
#
#   - laravel/pint       ships with new Laravel projects, so this always runs
#   - pestphp/pest       (require-dev) turns the test job on
#   - larastan/larastan  (require-dev) + phpstan.neon.dist turns analysis on
#
# Note: if phpunit.xml sets force="true" on the DB variables, remove it -
# otherwise sqlite from phpunit.xml wins over the Postgres service.
# =============================================================================

name: CI

on:
  push:
    branches: [main, release] # main is the released state, release is what gets tested
  pull_request:

permissions:
  contents: read

# A new push to the same branch/PR cancels running jobs (saves minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_MAIN_VERSION: '8.4' # for style/analysis/audit; tests run on the matrix
  NODE_VERSION: '24' # for the React frontend audit
  # Starts at 0 and is raised as the suite grows; see the Next.js template.
  COVERAGE_MIN: '0'

jobs:
  # ---------------------------------------------------------------------------
  # Code style - Pint with --test fails on deviations instead of fixing them
  # ---------------------------------------------------------------------------
  pint:
    name: Pint (code style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_MAIN_VERSION }}
          coverage: none

      - name: Install dependencies (cached)
        uses: ramsey/composer-install@4.0.0

      - name: Run Pint
        run: ./vendor/bin/pint --test

  # ---------------------------------------------------------------------------
  # Static analysis - Larastan; --error-format=github turns errors into
  # annotations on the PR diff
  # ---------------------------------------------------------------------------
  larastan:
    name: Larastan (static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_MAIN_VERSION }}
          coverage: none

      - name: Install dependencies (cached)
        uses: ramsey/composer-install@4.0.0

      - name: Look for Larastan
        id: probe
        run: |
          if [ -x vendor/bin/phpstan ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Larastan is not installed yet." >> "$GITHUB_STEP_SUMMARY"
            echo "composer require --dev larastan/larastan and add phpstan.neon.dist to turn this job on." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run PHPStan
        if: steps.probe.outputs.found == 'true'
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --error-format=github

  # ---------------------------------------------------------------------------
  # Tests - Pest on PHP 8.3 and 8.4, against a real PostgreSQL service, with
  # pcov for fast coverage and a configurable minimum
  # ---------------------------------------------------------------------------
  pest:
    name: Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # let 8.3 finish if 8.4 fails (and vice versa)
      matrix:
        php: ['8.3', '8.4']

    services:
      postgres:
        image: postgres:18 # matches the central databases stack
        env:
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: secret # dummy, CI container only
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laravel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: testing
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      # Keep external services out of CI
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, mbstring, dom, fileinfo, intl
          coverage: pcov # much faster than xdebug for coverage

      - name: Install dependencies (cached)
        uses: ramsey/composer-install@4.0.0

      - name: Look for Pest
        id: probe
        run: |
          if [ -x vendor/bin/pest ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Pest is not installed yet." >> "$GITHUB_STEP_SUMMARY"
            echo "composer require --dev pestphp/pest and run php artisan pest:install to turn this job on." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare the app
        if: steps.probe.outputs.found == 'true'
        run: |
          cp env.example .env
          php artisan key:generate

      - name: Run migrations
        if: steps.probe.outputs.found == 'true'
        run: php artisan migrate --force

      - name: Run Pest (coverage minimum enforced)
        if: steps.probe.outputs.found == 'true'
        run: ./vendor/bin/pest --coverage --min=${{ env.COVERAGE_MIN }}
        # Large suite? Add --parallel for considerably faster runs.

  # ---------------------------------------------------------------------------
  # Security - composer audit reads composer.lock (no vendor/ needed) and
  # fails on known vulnerabilities in dependencies
  # ---------------------------------------------------------------------------
  audit:
    name: Security audit (composer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_MAIN_VERSION }}
          coverage: none

      - name: Composer audit
        run: composer audit

  # ---------------------------------------------------------------------------
  # Security - the React frontend has its own dependency tree; npm audit reads
  # package-lock.json. Drop this job for a Laravel project without a frontend.
  # ---------------------------------------------------------------------------
  audit-npm:
    name: Security audit (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit
        run: npm audit --audit-level=high
