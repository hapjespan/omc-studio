name: CI

on:
  push:
    branches: [main, release]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '24'
  APP_ENV: testing
  APP_KEY: 'base64:Vn2utCpJjCtA1UHy8yLfPFWDYMvswA8Ss0CS20rcF34='

jobs:
  php-sqlite:
    name: PHP suite on SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite, gd, intl, zip
          coverage: none
      - uses: ramsey/composer-install@4.0.0
      - run: cp env.example .env
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: composer verify
      - run: composer test

  php-postgres:
    name: PHP suite on PostgreSQL
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: omc-studio
      DB_USERNAME: omc-studio
      DB_PASSWORD: ci-only
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: omc-studio
          POSTGRES_USER: omc-studio
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omc-studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, gd, intl, zip
          coverage: none
      - uses: ramsey/composer-install@4.0.0
      - run: cp env.example .env
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: php artisan migrate --force
      - run: composer test

  js:
    name: Vitest, types, lint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: npm run check

  scope:
    name: Scope of the change
    runs-on: ubuntu-latest
    outputs:
      documentation_only: ${{ steps.scope.outputs.documentation_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        run: |
          only=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            others=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -Ev '^(specs/|docs/)|\.md$' || true)
            [ -z "$others" ] && only=true
          fi
          echo "documentation_only=$only" >> "$GITHUB_OUTPUT"

  e2e:
    name: Playwright on three engines
    needs: scope
    if: needs.scope.outputs.documentation_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite, gd, intl, zip
          coverage: none
      - uses: ramsey/composer-install@4.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: sh scripts/serve-e2e.sh
      - run: |
          n=0
          until npx playwright install --with-deps chromium firefox webkit; do
            n=$((n + 1))
            [ "$n" -ge 3 ] && exit 1
            sleep 20
          done
      - run: xvfb-run -a npx playwright test --grep-invert '@performance|Secure session cookie'
      - run: SESSION_SECURE_COOKIE=true sh scripts/serve-e2e.sh
      - run: xvfb-run -a npx playwright test --project=chromium --grep 'Secure session cookie'

  e2e-performance:
    name: Playwright performance on three engines
    needs: scope
    if: needs.scope.outputs.documentation_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite, gd, intl, zip
          coverage: none
      - uses: ramsey/composer-install@4.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: sh scripts/serve-e2e.sh
      - run: |
          n=0
          until npx playwright install --with-deps chromium firefox webkit; do
            n=$((n + 1))
            [ "$n" -ge 3 ] && exit 1
            sleep 20
          done
      - run: xvfb-run -a npx playwright test --grep '@performance' --workers=1 --retries=0

  audit:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - run: composer audit --locked
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-audit.mjs

  image:
    name: Delivered image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag omc-studio:ci .
