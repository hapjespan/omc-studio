services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: "omc-studio-dev"
    volumes:
      - ..:/workspace/omc-studio
      - ${DEV_CLAUDE_HOME:-/root/.claude}:/root/.claude
      - ${DEV_CLAUDE_JSON:-/root/.claude.json}:/root/.claude.json
      - ${DEV_KNOWLEDGE:-/root/knowledge}:/workspace/knowledge
      - ${DEV_GH_DIR:-/root/.config/gh}:/run/host-gh:ro
      - ${DEV_GITCONFIG:-/root/.gitconfig}:/root/.gitconfig:ro
      - ${DEV_PONYTAIL_DIR:-/root/.config/ponytail}:/root/.config/ponytail
    env_file:
      - path: ${DEV_SECRETS_ENV:-/dev/null}
        required: false
    environment:
      GH_CONFIG_DIR: /root/.gh
      PORT: ${DEV_PORT:-3000}
      SERVER_PORT: ${DEV_PORT:-8000}
      VITE_PORT: ${VITE_PORT:-5173}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p "$$GH_CONFIG_DIR" && chmod 700 "$$GH_CONFIG_DIR"
        cp /run/host-gh/hosts.yml "$$GH_CONFIG_DIR/hosts.yml" 2>/dev/null || true
        chmod 600 "$$GH_CONFIG_DIR/hosts.yml" 2>/dev/null || true
        exec sleep infinity
    ports:
      - "127.0.0.1:${DEV_PORT:-3000}:${DEV_PORT:-3000}"
      - "127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    working_dir: /workspace/omc-studio
    networks: [dev-net]
    tty: true

networks:
  dev-net:
    external: true
