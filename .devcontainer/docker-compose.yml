# This stack is the development container, not the delivered one. The host runs
# `docker compose up -d` in the project folder, so the local, uncommitted .env at
# the repository root points Compose here:
# COMPOSE_FILE=.devcontainer/docker-compose.yml
# COMPOSE_PROJECT_NAME=omc-studio
# See .devcontainer/README.md for those lines and the DEV_* variables.
services:
  dev:
    # Context is the repository root, so .dockerignore stays there; every other
    # relative path in this file resolves from .devcontainer/.
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: "omc-studio-dev"
    volumes:
      - ..:/workspace/omc-studio
      # Claude Code writes sessions, history and project state here, so this one
      # cannot be read-only. It carries .credentials.json: see the security note
      # in the claude-config README before adding an untrusted dependency.
      - ${DEV_CLAUDE_HOME:-/root/.claude}:/root/.claude
      - ${DEV_CLAUDE_JSON:-/root/.claude.json}:/root/.claude.json
      - ${DEV_KNOWLEDGE:-/root/knowledge}:/workspace/knowledge
      # The host's gh config, read-only and out of the way. The entrypoint copies
      # the token into a writable container-local config dir, because gh migrates
      # and rewrites its own config on first run and dies on a read-only file.
      # A container can therefore use the token but not rewrite the host's copy.
      - ${DEV_GH_DIR:-/root/.config/gh}:/run/host-gh:ro
      - ${DEV_GITCONFIG:-/root/.gitconfig}:/root/.gitconfig:ro
      # Ponytail's task board: one CSV per project, kept on the host so it
      # survives a recreated container and the orchestrator can read them all.
      - ${DEV_PONYTAIL_DIR:-/root/.config/ponytail}:/root/.config/ponytail
    # Host paths above default to the Linux host layout; a Mac host sets the
    # DEV_* variables in .env. The env file carries CLAUDE_CODE_OAUTH_TOKEN where
    # the host login cannot be shared (macOS keeps it in the Keychain).
    env_file:
      - path: ${DEV_SECRETS_ENV:-/dev/null}
        required: false
    environment:
      GH_CONFIG_DIR: /root/.gh
      # The ports block publishes DEV_PORT:DEV_PORT, so the server inside the
      # container has to bind DEV_PORT too, not its framework default. next dev
      # reads PORT, artisan serve reads SERVER_PORT. Vite reads neither, so
      # VITE_PORT is exported for vite.config or `npm run dev -- --port`.
      PORT: ${DEV_PORT:-3000}
      SERVER_PORT: ${DEV_PORT:-8000}
      VITE_PORT: ${VITE_PORT:-5173}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p "$$GH_CONFIG_DIR" && chmod 700 "$$GH_CONFIG_DIR"
        cp /run/host-gh/hosts.yml "$$GH_CONFIG_DIR/hosts.yml" 2>/dev/null || true
        chmod 600 "$$GH_CONFIG_DIR/hosts.yml" 2>/dev/null || true
        exec sleep infinity
    ports:
      # Bound to the loopback interface on purpose: this host is reachable from
      # the internet, and a dev server is not. Reach it over an SSH tunnel:
      #   ssh -L 3000:127.0.0.1:3000 root@<host>
      - "127.0.0.1:${DEV_PORT:-3000}:${DEV_PORT:-3000}"
      - "127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    working_dir: /workspace/omc-studio
    networks: [dev-net]
    tty: true

networks:
  dev-net:
    external: true
